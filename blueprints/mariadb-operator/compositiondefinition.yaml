# Registers the mariadb-operator chart with Krateo core-provider, which generates a Composition CRD from the chart's
# values.schema.json and serves it at composition.krateo.io/v26-10-2. release-tag.yaml ships this file inside the chart
# archive (krateo-blueprints/charts PUBLISHING.md rule 3) and refuses a URL or version that does not match the chart.
apiVersion: core.krateo.io/v1alpha1
kind: CompositionDefinition
metadata:
  name: mariadb-operator
  namespace: mariadb-operator-system
spec:
  chart:
    url: oci://ghcr.io/krateo-blueprints/charts/mariadb-operator
    version: "26.10.2"
